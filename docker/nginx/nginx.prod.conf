worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream sentinel_backend {
        server backend:8000;
    }

    upstream sentinel_frontend {
        server frontend:80;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://sentinel_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /health {
            proxy_pass http://sentinel_backend/health;
            proxy_set_header Host $host;
        }

        location /docs {
            proxy_pass http://sentinel_backend/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://sentinel_backend/openapi.json;
            proxy_set_header Host $host;
        }

        location /api/v1/automation/ws {
            proxy_pass http://sentinel_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://sentinel_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Enable after certbot (see ORACLE_CLOUD_GUIDE.md):
    # server {
    #     listen 443 ssl http2;
    #     server_name YOUR_DOMAIN;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     # duplicate location blocks from port 80 server
    # }
}
